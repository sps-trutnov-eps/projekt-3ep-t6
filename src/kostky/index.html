<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farkle</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      defer></script>
    <script src="script.js" type="module"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #eee;
        overflow: hidden;
      }

      #game-wrapper {
        display: flex;
        flex-direction: column;
        width: 90vw;
        height: 96vh;
        max-width: 1400px;
        gap: 8px;
      }

      /* --- Top bar: scores --- */
      #score-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #222;
        border-radius: 8px;
        padding: 10px 24px;
        flex-shrink: 0;
      }
      .score-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .score-group .label {
        font-size: 13px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .score-group .value {
        font-size: 24px;
        font-weight: bold;
      }
      #player-score-group .value { color: #fff; }
      #ai-score-group .value { color: #f77; }
      #turn-score-group .value { color: #f0c040; }
      #turn-indicator {
        font-size: 14px;
        font-weight: 600;
        color: #aaa;
        padding: 4px 12px;
        border-radius: 4px;
        background: #2a2a2a;
      }
      #turn-indicator.human { color: #4af; }
      #turn-indicator.ai { color: #f77; }

      /* --- Canvas --- */
      #canvas-area {
        flex: 1;
        min-height: 0;
      }
      #cnv {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 8px;
        background: #000;
      }

      /* --- Bottom bar: status + dice + actions --- */
      #bottom-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        background: #222;
        border-radius: 8px;
        padding: 10px 24px;
        flex-shrink: 0;
      }

      #status-msg {
        font-size: 16px;
        font-weight: 600;
        min-height: 24px;
        text-align: center;
      }
      #status-msg.farkle { color: #ff4444; }
      #status-msg.win { color: #44ff44; font-size: 20px; }
      #status-msg.lose { color: #ff4444; font-size: 20px; }

      #controls-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #dice-buttons {
        display: flex;
        gap: 6px;
      }
      .die-btn {
        width: 50px; height: 50px;
        border: 2px solid #444;
        border-radius: 8px;
        background: #2a2a2a;
        color: #ddd;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .die-btn:hover:not(:disabled) { border-color: #888; }
      .die-btn.selected {
        border-color: #f0c040;
        background: rgba(240,192,64,0.2);
        color: #f0c040;
      }
      .die-btn.kept {
        border-color: #4a4;
        background: rgba(68,170,68,0.15);
        color: #6c6;
        cursor: default;
      }
      .die-btn:disabled { opacity: 0.3; cursor: default; }

      #selection-score {
        font-size: 13px;
        color: #f0c040;
        min-width: 80px;
        text-align: center;
      }

      #actions {
        display: flex;
        gap: 8px;
      }
      #actions button {
        padding: 10px 28px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s;
      }
      #btn-roll { background: #2a7fff; color: #fff; }
      #btn-roll:hover:not(:disabled) { background: #1a6fef; }
      #btn-confirm { background: #f0c040; color: #222; }
      #btn-confirm:hover:not(:disabled) { background: #e0b030; }
      #btn-bank { background: #4a4; color: #fff; }
      #btn-bank:hover:not(:disabled) { background: #393; }
      #actions button:disabled { opacity: 0.3; cursor: default; }
    </style>
</head>
<body>
  <div id="game-wrapper">
    <!-- Top: scores -->
    <div id="score-bar">
      <div class="score-group" id="player-score-group">
        <span class="label">You</span>
        <span class="value" id="player-score">0</span>
      </div>
      <div class="score-group" id="turn-score-group">
        <span class="label">Turn</span>
        <span class="value" id="turn-score">0</span>
      </div>
      <div id="turn-indicator" class="human">Your turn</div>
      <div class="score-group" id="ai-score-group">
        <span class="label">AI</span>
        <span class="value" id="ai-score">0</span>
      </div>
    </div>

    <!-- Middle: canvas -->
    <div id="canvas-area">
      <canvas id="cnv" width="1280" height="960"></canvas>
    </div>

    <!-- Bottom: status + dice + actions -->
    <div id="bottom-bar">
      <div id="status-msg">Press Roll to start!</div>
      <div id="controls-row">
        <div id="dice-buttons">
          <button class="die-btn" data-index="0" disabled>-</button>
          <button class="die-btn" data-index="1" disabled>-</button>
          <button class="die-btn" data-index="2" disabled>-</button>
          <button class="die-btn" data-index="3" disabled>-</button>
          <button class="die-btn" data-index="4" disabled>-</button>
          <button class="die-btn" data-index="5" disabled>-</button>
        </div>
        <div id="selection-score"></div>
        <div id="actions">
          <button id="btn-roll">Roll</button>
          <button id="btn-confirm" disabled>Confirm</button>
          <button id="btn-bank" disabled>Bank</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
