services:
  app:
    build: ./src
    ports:
      - "3000:3000"
    environment:
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=moje_databaze
      - PGHOST=db
      - PGPORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
  
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=moje_databaze
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: